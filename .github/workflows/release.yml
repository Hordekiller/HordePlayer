name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev curl xz-utils

      - name: Fetch static ffmpeg (for a self-contained AppImage)
        run: |
          mkdir -p "$HOME/bin"
          curl -fL -o /tmp/ff.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          d="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-static')"
          cp "$d/ffmpeg" "$d/ffprobe" "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: bash packaging/build-all.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hordeplayer-packages
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install snapcraft + LXD
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd --channel=latest/stable
          sudo lxd init --minimal
          sudo usermod -aG lxd "$USER"

      - name: Build snap
        run: sg lxd -c "snapcraft pack"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: hordeplayer-snap
          path: '*.snap'

      - name: Publish snap release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.snap'
